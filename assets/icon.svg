<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D131C"/>
      <stop offset="1" stop-color="#080B11"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.72" cy="0.28" r="0.5">
      <stop offset="0" stop-color="#E8A33D" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#E8A33D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2735"/>
      <stop offset="1" stop-color="#121B27"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="1024" height="1024" rx="205" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="205" fill="url(#sun)"/>
  <!-- desert horizon -->
  <path d="M120 720 Q 512 660 904 720 L 904 860 L 120 860 Z" fill="#E8A33D" opacity="0.10"/>

  <g filter="url(#glow)">
    <!-- sandcrawler hull: trapezoid, wider at base -->
    <path d="M300 640 L360 356 L664 356 L724 640 Z"
          fill="url(#hull)" stroke="#46C7E0" stroke-width="12" stroke-linejoin="round"/>
    <!-- top tower / bridge -->
    <path d="M436 356 L452 300 L572 300 L588 356 Z"
          fill="#121B27" stroke="#46C7E0" stroke-width="10" stroke-linejoin="round"/>
    <!-- viewport lights -->
    <circle cx="430" cy="430" r="17" fill="#46C7E0"/>
    <circle cx="512" cy="430" r="17" fill="#E8A33D"/>
    <circle cx="594" cy="430" r="17" fill="#46C7E0"/>
    <!-- hull seam -->
    <path d="M360 512 L664 512" stroke="#46C7E0" stroke-width="7" opacity="0.5"/>
    <!-- tread housing -->
    <rect x="276" y="640" width="472" height="96" rx="30"
          fill="#0F1620" stroke="#46C7E0" stroke-width="12"/>
    <!-- tread wheels -->
    <g fill="#0A0E15" stroke="#46C7E0" stroke-width="9">
      <circle cx="342" cy="688" r="26"/>
      <circle cx="427" cy="688" r="26"/>
      <circle cx="512" cy="688" r="26"/>
      <circle cx="597" cy="688" r="26"/>
      <circle cx="682" cy="688" r="26"/>
    </g>
  </g>
</svg>
